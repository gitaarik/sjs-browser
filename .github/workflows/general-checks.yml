name: General Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install --quiet yamllint==1.37.1
      - run: yamllint .

      # Every tracked shell script: *.sh, and extensionless files with a sh or
      # bash shebang (the git hooks). .shellcheckrc lets it follow `source`.
      # Clean at shellcheck's default severity since 2026-09-26: notes fail too.
      - name: shellcheck
        run: |
          pip install --quiet shellcheck-py==0.11.0.1
          re='^#!.*[/ ](ba|da)?sh( |$)'
          git ls-files -z | while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            if [[ $f == *.sh ]]; then printf '%s\0' "$f"; continue; fi
            first=''
            IFS= read -r first < "$f" || true
            if [[ $first =~ $re ]]; then printf '%s\0' "$f"; fi
          done | xargs -0 --no-run-if-empty shellcheck

      # The workflows themselves: expressions, action inputs, runner labels,
      # and every run: block through shellcheck, which the step above put on
      # PATH. Clean since 2026-09-26.
      - name: actionlint
        run: |
          pip install --quiet actionlint-py==1.7.12.25
          actionlint

  lint-git:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check for fixup/squash commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"
          BAD=$(git log --oneline "origin/$BASE_REF..HEAD" --grep '^\(fixup\|squash\)!' || true)
          if [ -n "$BAD" ]; then
            printf '::error::fixup!/squash! commits found — squash them before merge:\n%s\n' "$BAD" >&2
            exit 1
          fi
      - name: Check feature branch is up-to-date with base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"
          BEHIND=$(git rev-list --count "HEAD..origin/$BASE_REF" || echo 0)
          if [ "$BEHIND" -gt 0 ]; then
            echo "::warning::Branch is $BEHIND commit(s) behind origin/$BASE_REF — consider rebasing." >&2
          fi
      - name: Check no merge of base into feature branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"
          MERGES=$(git log --oneline --merges "origin/$BASE_REF..HEAD" \
            --grep "Merge .* into" --grep "Merge branch '$BASE_REF'" || true)
          if [ -n "$MERGES" ]; then
            printf '::error::Merge of %s into feature branch detected — rebase instead:\n%s\n' "$BASE_REF" "$MERGES" >&2
            exit 1
          fi

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          # Warnings fail too, since 2026-09-24, when the last ones were fixed:
          # pipefail for the piped RUNs, curl rather than wget + curl, and an
          # exec-form HEALTHCHECK. DL3008 is ignored in .hadolint.yaml, with why.
          failure-threshold: warning

  # Moved here from sjs-ops, which had to check out every submodule to reach
  # this Dockerfile and paid metered Actions minutes to build it — it was the
  # single largest line item on that account. This repo is public, so the same
  # build is free, runs on every push rather than only when the submodule
  # pointer moves, and lives next to the file it scans.
  dockle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # Don't push, just load into the local docker daemon.
          load: true
          # Tag is required but doesn't matter since we're not pushing.
          tags: sjs-browser-scan:ci
      - name: Run Dockle
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: 'sjs-browser-scan:ci'
          format: 'list'
          exit-code: '1'
          # Fail only on FATAL; WARN/INFO accepted during adoption.
          exit-level: 'fatal'
          # CIS-DI-0001: Create a user for the container (WARN)
          # CIS-DI-0005: Enable content trust for Docker (INFO)
          # CIS-DI-0006: Add HEALTHCHECK instruction (INFO)
          # CIS-DI-0010: fires on benign SJS_BROWSER_* build args, not secrets.
          ignore: 'CIS-DI-0001,CIS-DI-0005,CIS-DI-0006,CIS-DI-0010'
      - name: Run dive
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e CI=true \
            wagoodman/dive:v0.13.1 sjs-browser-scan:ci
