name: Promote :latest

# Manually advance the rolling :latest Docker tag to an already-published
# stable :vX.Y.Z image, after it has soaked on dev for ~24-48h. The release
# workflow no longer tags :latest automatically — this gates image-level
# regressions (Chrome/Node/base-OS/bootstrap bugs) off the auto-updating
# user base until the build is vetted. Re-tags by digest (no rebuild), so
# :latest points at the exact bytes that were soaked.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable image tag to promote to :latest (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-latest
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          # Stable-only: no hyphen suffix. :latest must never point at a
          # pre-release. Full-match regex also blocks injection into $GITHUB_OUTPUT.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Tag must be a stable vX.Y.Z (got: %q)\n' "$TAG" >&2
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Require the source image to exist
        env:
          SRC: gitaarik036/sjs-browser:${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          if ! docker manifest inspect "$SRC" >/dev/null 2>&1; then
            echo "$SRC does not exist on Docker Hub — nothing to promote." >&2
            echo "Cut the release first; only soaked, published tags can be promoted." >&2
            exit 1
          fi
          echo "OK: $SRC exists."

      - name: Re-tag :latest by digest
        env:
          SRC: gitaarik036/sjs-browser:${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          # imagetools create copies the source manifest (all platforms) to the
          # :latest tag without pulling or rebuilding — :latest then resolves to
          # the identical digest.
          docker buildx imagetools create -t gitaarik036/sjs-browser:latest "$SRC"
          echo "Promoted $SRC -> :latest"
          # Informational only. `inspect | head` would SIGPIPE inspect once head
          # closes the pipe, and under `pipefail` that fails the whole step even
          # though the promote above already succeeded (run 29148982375). Capture
          # first, then head — no pipe, no SIGPIPE.
          INSPECT="$(docker buildx imagetools inspect gitaarik036/sjs-browser:latest)"
          printf '%s\n' "$INSPECT" | head -5
