name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    # sjs-browser has no test suite today; `tsc --noEmit` is the bar.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      # oxlint and prettier, pinned in package.json's scripts rather than
      # installed as devDependencies, which would ship in the release tarball.
      # Both clean since 2026-09-26, so any finding fails.
      - run: npm run lint
      - run: npm run format:check
