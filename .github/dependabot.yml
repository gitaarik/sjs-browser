# Dependabot config for sjs-browser.
# Mirrors sjs-cloud: weekly, minor+patch grouped into one PR per ecosystem so
# majors stay reviewable on their own.
version: 2
updates:
  # --- npm ---
  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # --- Docker (Dockerfile + compose examples) ---
  - package-ecosystem: docker
    directories:
      - /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
